apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: admin       
    secureJsonData:
      password: admin 
    jsonData:
      database: employees       
      sslmode: "disable"
      postgresVersion: 10